<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GURPS Magias - Biblioteca Arcana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>

    <style>
        :root {
            --rpg-cyan: #66FCF1;
            --rpg-purple: #b48ead;
            --rpg-silver: #C5C6C7;
            --rpg-slate: #151b24;
            --rpg-black: #0B0C10;
        }

        /* Estética Aprimorada: Inspirado na imagem base */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050b14;
            color: var(--rpg-silver);
            overflow: hidden;
            background-image: 
                radial-gradient(circle at center, transparent 0%, #02040a 100%),
                url('https://www.transparenttextures.com/patterns/stardust.png'); /* Overlay estrelado leve */
        }

        h1, h2, h3, .font-cinzel { font-family: 'Cinzel', serif; }

        header {
            background: linear-gradient(180deg, rgba(5, 11, 20, 0.95), transparent);
            border-bottom: 1px solid rgba(102, 252, 241, 0.2);
            z-index: 100;
        }

        /* Fundo Rúnico Central (Efeito Anel) */
        #rune-ring {
            position: absolute;
            top: 50%; left: 50%;
            width: 800px; height: 800px;
            transform: translate(-50%, -50%);
            border: 2px dashed rgba(102, 252, 241, 0.1);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            display: flex; align-items: center; justify-content: center;
        }
        #rune-ring::before {
            content: '';
            position: absolute;
            width: 600px; height: 600px;
            border: 1px solid rgba(102, 252, 241, 0.05);
            border-radius: 50%;
        }

        /* Hexagonal Styles (Com SVG Base) */
        .hex-node {
            position: absolute;
            width: 64px;
            height: 74px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        /* O shape do hexágono é gerado via SVG background para ter borda */
        .hex-shape {
            position: absolute;
            inset: 0;
            z-index: -1;
            transition: all 0.3s;
        }
        .hex-shape polygon {
            stroke-width: 2;
            fill: #0c1524;
            stroke: #475569;
            transition: all 0.3s;
        }

        .hex-node:hover { transform: scale(1.15); z-index: 50; }
        .hex-node:hover .hex-shape polygon { fill: #1e293b; }

        /* Statuses */
        .hex-node.locked { filter: grayscale(100%) opacity(0.6); }
        .hex-node.locked .hex-shape polygon { fill: #070b12; stroke: #334155; }
        
        .hex-node.available .hex-shape polygon { stroke: var(--rpg-silver); }
        .hex-node.available { animation: float-glow 3s infinite ease-in-out; }

        .hex-node.unlocked .hex-shape polygon { 
            fill: rgba(102, 252, 241, 0.1);
            stroke: var(--rpg-cyan); 
            filter: drop-shadow(0 0 8px var(--rpg-cyan));
        }

        /* Magery 0 (Core Central Star) */
        .hex-node.core {
            width: 100px; height: 115px;
        }
        .hex-node.unlocked.core .hex-shape polygon {
            stroke: #ffd700;
            fill: rgba(255, 215, 0, 0.15);
            stroke-width: 3;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.8));
        }
        .hex-node.unlocked.core .icon { color: #ffd700; font-size: 24px; text-shadow: 0 0 10px #ffd700; }
        .hex-node.unlocked.core .spell-title { color: #ffd700; }

        .spell-title { font-size: 9px; font-weight: bold; color: #cbd5e1; line-height: 1; margin-top: 4px; text-transform: uppercase; z-index: 2;}
        .icon { font-size: 20px; color: #94a3b8; z-index: 2; }
        .hex-node.unlocked .icon { color: var(--rpg-cyan); text-shadow: 0 0 5px var(--rpg-cyan); }
        .hex-node.unlocked .spell-title { color: white; }

        /* Conexões Espessas e Brilhantes */
        .tree-line {
            position: absolute;
            background-color: #1e293b;
            z-index: 1;
            transform-origin: left center;
            height: 4px; /* Linha mais grossa */
            border-radius: 2px;
            opacity: 0.8;
            transition: all 0.5s ease;
        }
        .tree-line.active {
            background-color: var(--rpg-cyan);
            box-shadow: 0 0 10px var(--rpg-cyan), 0 0 20px var(--rpg-cyan);
            opacity: 1;
        }

        @keyframes float-glow {
            0%, 100% { filter: drop-shadow(0 0 2px rgba(197, 198, 199, 0.3)); transform: translateY(0); }
            50% { filter: drop-shadow(0 0 10px rgba(197, 198, 199, 0.8)); transform: translateY(-2px); }
        }

        /* Tooltip Premium */
        .tooltip {
            position: absolute;
            background: linear-gradient(135deg, rgba(20, 30, 45, 0.95), rgba(10, 15, 25, 0.98));
            backdrop-filter: blur(10px);
            border: 1px solid #ef4444;
            border-left: 4px solid #ef4444;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            transform: translateY(10px);
            z-index: 100;
            width: 280px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .tooltip.show { opacity: 1; transform: translateY(0); }
        .tooltip.good { border-color: var(--rpg-cyan); border-left-color: var(--rpg-cyan); }

        #tree-viewport { width: 100vw; height: calc(100vh - 80px); cursor: grab; position: relative; overflow: hidden; background: radial-gradient(circle at center, rgb(16, 21, 28) 0%, rgb(5, 7, 10) 100%); }
        #tree-viewport:active { cursor: grabbing; }
        #tree-canvas { position: absolute; transform-origin: 0 0; width: 0; height: 0; }
        #center-point { position: absolute; top: 50vh; left: 50vw; }
        
        .controls-panel {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(21, 27, 36, 0.9); border: 1px solid var(--rpg-purple);
            padding: 10px; border-radius: 8px; z-index: 80;
        }
    </style>
</head>

<body>
    <header class="p-4 flex justify-between items-center relative shadow-[0_5px_15px_rgba(0,0,0,0.5)]">
        <div>
            <h1 class="text-2xl md:text-3xl font-cinzel font-bold tracking-wider" style="color:var(--rpg-purple);">Biblioteca Arcana</h1>

    <div id="tree-viewport">
        <div id="tree-canvas">

            </div>
        </div>
        <div id="info-tooltip" class="tooltip"></div>

        <!-- Legend and Filters -->

            <h3 class="font-cinzel text-rpg-purple mb-2">Focar Colégio</h3>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button onclick="focusAngle(0)" class="text-left text-orange-400 hover:text-white"><i class="fa-solid fa-fire"></i> Fogo</button>
                <button onclick="focusAngle(45)" class="text-left text-blue-400 hover:text-white"><i class="fa-solid fa-water"></i> Água</button>
                <button onclick="focusAngle(90)" class="text-left text-green-600 hover:text-white"><i class="fa-brands fa-pagelines"></i> Terra</button>
                <button onclick="focusAngle(135)" class="text-left text-gray-400 hover:text-white"><i class="fa-solid fa-wind"></i> Ar</button>

                <button onclick="focusAngle(-45)" class="text-left text-gray-500 hover:text-white"><i class="fa-solid fa-moon"></i> Luz/Trevas</button>
            </div>
        </div>

        <div class="controls-panel flex gap-2">
            <button class="px-3 py-1 bg-gray-800 text-white rounded hover:bg-gray-700 border border-gray-600" onclick="resetView()"><i class="fa-solid fa-crosshairs"></i> Restaurar Câmera</button>
        </div>
    </div>

    <!-- Purchase Modal -->
    <div id="purchase-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[110] backdrop-blur-md">
        <div class="bg-rpg-slate border-2 border-[var(--rpg-purple)] p-6 rounded-lg max-w-sm w-full shadow-[0_0_30px_rgba(180,142,173,0.3)]">
            <h3 id="modal-title" class="font-cinzel text-xl text-[var(--rpg-purple)] mb-2">Aprender Feitiço</h3>
            <p id="modal-desc" class="text-gray-300 text-sm mb-4">Tem certeza que deseja gastar CP para destravar este conhecimento?</p>
            <div class="flex gap-4">
                <button id="btn-confirm-buy" class="flex-1 bg-[var(--rpg-purple)] text-black font-bold py-2 rounded hover:bg-white transition-colors">Confirmar</button>
                <button onclick="closeModal()" class="flex-1 bg-gray-700 text-white font-bold py-2 rounded hover:bg-red-600 transition-colors">Cancelar</button>
            </div>
        </div>
    </div>

        const collegeAngles = {
            'Core': -90, // Core branches straight up
            'Fire': 0, 'Water': 45, 'Earth': 90, 'Air': 135,
            'Healing': 180, 'Mind Control': -135, 'Protection': -90, 'Light/Darkness': -45
        };

        const spellTree = {};

        // ALGORITMO ORBITAL (Cálculo Dinâmico das Coordenadas via Requisitos)
        function computeLayout() {
            // Função recursiva modesta para achar Camadas (Tiers)
            function getTier(id, depth = 0) {
                if (depth > 20) return 1; // Safeguard loop infinito
                if (id === 'magery_0') return 0;
                
                const spell = rawSpells[id];
                if (!spell || !spell.reqs || spell.reqs.length === 0) return 1;
                
                let maxT = 0;
                spell.reqs.forEach(req => {
                    const rt = getTier(req, depth + 1);
                    if (rt > maxT) maxT = rt;
                });
                return maxT + 1;
            }

            // Atribuir Tier para todas magias
            Object.keys(rawSpells).forEach(id => {
                spellTree[id] = { ...rawSpells[id], _tier: getTier(id) };
            });

            // Distribuir no plano Polar
            let counters = {}; // Para espaçar spells do mesmo colégio e mesmo tier
            Object.keys(spellTree).forEach(id => {
                const s = spellTree[id];
                if (id === 'magery_0') {
                    s.x = 0; s.y = 0; return; // Centro do Cosmos
                }

                if (s.college === 'Core') {
                    s.x = 0; s.y = s._tier * -130; return; // Eixo Y centralizado subindo
                }

                const key = s.college + '_' + s._tier;
                counters[key] = (counters[key] || 0) + 1;
                let countIndex = counters[key] - 1;

                const baseAngle = collegeAngles[s.college] !== undefined ? collegeAngles[s.college] : 0;
                
                // Offset Spread: Index 0=0, Index 1=+20deg, Index 2=-20deg, Index 3=+40deg...
                let offset = countIndex === 0 ? 0 : (countIndex % 2 === 1 ? (Math.ceil(countIndex/2) * 25) : -(Math.ceil(countIndex/2) * 25));

                const ang = (baseAngle + offset) * Math.PI / 180;
                const radius = s._tier * 160;

                s.x = Math.round(Math.cos(ang) * radius);
                s.y = Math.round(Math.sin(ang) * radius);
            });
        }

        // INIT
        computeLayout();

        // -------------------------------------------------------------
        // UI Handling
        // -------------------------------------------------------------
        const centerPoint = document.getElementById('center-point');
        const tooltip = document.getElementById('info-tooltip');
        const cpDisplay = document.getElementById('cp-display');
        const modal = document.getElementById('purchase-modal');
        let selectedSpellId = null;

        firebase.auth().onAuthStateChanged(async (user) => {
            if (user) {
                currentUserUid = user.uid;
                document.getElementById('user-display').innerHTML = `Logado <span class="text-[var(--rpg-purple)] text-xs">${user.uid.substring(0,8)}</span>`;
                await loadPlayerData();
                renderTree();
            } else {
                window.location.href = "login.html"; // Assume existe no repositório
            }
        });

        async function loadPlayerData() {
            try {
                const doc = await db.collection("users").doc(currentUserUid).get();
                if(doc.exists && doc.data().spells_learned) {
                    userSpells = doc.data().spells_learned;
                    userCP = doc.data().cp_available !== undefined ? doc.data().cp_available : 50;
                } else {
                    userSpells = {}; userCP = 50; 
                }
                updateCPDisplay();
            } catch (e) {
                console.error("Erro no Auth/DB", e);
            }
        }

        function updateCPDisplay() { cpDisplay.innerText = userCP; }

        function renderTree() {
            centerPoint.innerHTML = ''; 
            
            // Desenhar Linhas (Dependências)
            Object.keys(spellTree).forEach(id => {
                const node = spellTree[id];
                node.reqs.forEach(reqId => {
                    if(!spellTree[reqId]) return;
                    drawLine(spellTree[reqId].x, spellTree[reqId].y, node.x, node.y, id, reqId);
                });
            });

            // Desenhar Hexágonos (Nós)
            Object.keys(spellTree).forEach(id => {
                createNode(id, spellTree[id]);
            });
        }

        function drawLine(x1, y1, x2, y2, targetId, reqId) {
            const line = document.createElement('div');
            line.className = 'tree-line';
            
            const dx = x2 - x1;
            const dy = y2 - y1;
            const length = Math.sqrt(dx * dx + dy * dy);
            const angle = Math.atan2(dy, dx) * 180 / Math.PI;

            // Centro do Hex (Raio de ~35/40px compensado)
            line.style.width = `${length}px`;
            line.style.left = `${x1 + 35}px`;
            line.style.top = `${y1 + 40}px`;
            line.style.transform = `rotate(${angle}deg)`;
            
            if(userSpells[targetId] > 0 && userSpells[reqId] > 0) line.classList.add('active');
            
            centerPoint.appendChild(line);
        }

        function createNode(id, spell) {
            const el = document.createElement('div');
            el.className = `hex-node ${id === 'magery_0' ? 'core' : ''}`;
            el.style.left = `${spell.x - 32}px`; // Center offset (64/2)
            el.style.top = `${spell.y - 37}px`;  // Center offset (74/2)

            const shape = document.createElement('div');
            shape.className = 'hex-shape';
            shape.innerHTML = `<svg viewBox="0 0 100 115" preserveAspectRatio="none" style="width:100%; height:100%;"><polygon points="50,0 100,28 100,86 50,115 0,86 0,28" /></svg>`;

            el.innerHTML = `
                <i class="${spell.icon} icon"></i>
                <div class="spell-title">${spell.name}</div>
            `;
            el.appendChild(shape);

            let hasReqs = checkReqs(id);
            let isUnlocked = userSpells[id] > 0;

            if (isUnlocked) el.classList.add('unlocked');
            else if (hasReqs) { el.classList.add('available'); el.onclick = () => promptPurchase(id); }
            else el.classList.add('locked');

            el.addEventListener('mouseenter', (e) => showTooltip(e, id, hasReqs, isUnlocked));
            el.addEventListener('mouseleave', hideTooltip);

            centerPoint.appendChild(el);
        }

        function checkReqs(id) {
            return spellTree[id].reqs.every(req => userSpells[req] > 0);
        }

        function promptPurchase(id) {
            const spell = spellTree[id];
            const cost = spell.cost || 1;
            
            if (userCP < cost) { alert(`CPs Insuficientes! Custa ${cost} CP.`); return; }

            selectedSpellId = id;
            document.getElementById('modal-title').innerText = `Aprender: ${spell.name}`;
            document.getElementById('modal-desc').innerText = `Isto curstará ${cost} Pontos de Personagem (CP). Deseja continuar?`;
            modal.classList.remove('hidden');
        }

        function closeModal() { modal.classList.add('hidden'); selectedSpellId = null; }

        document.getElementById('btn-confirm-buy').addEventListener('click', async () => {
            if(!selectedSpellId) return;
            const spell = spellTree[selectedSpellId];
            const cost = spell.cost || 1;
            
            if (userCP >= cost) {
                userCP -= cost;
                userSpells[selectedSpellId] = (userSpells[selectedSpellId] || 0) + 1;
                
                try {
                    await db.collection('users').doc(currentUserUid).set({
                        spells_learned: userSpells,
                        cp_available: userCP
                    }, { merge: true });
                    
                    updateCPDisplay(); renderTree(); closeModal();
                } catch(e) { alert("Erro ao gravar magia no banco."); }
            }
        });

        function showTooltip(e, id, hasReqs, isUnlocked) {
            const spell = spellTree[id];
            const cost = spell.cost || 1;
            let html = `<div class="font-bold text-lg border-b border-gray-600 pb-1 mb-2 tracking-wide font-cinzel text-white flex items-center justify-between">
                            <span>${spell.name}</span>
                            <span class="text-xs text-gray-400 bg-gray-800 px-2 rounded">${spell._tier}º Ciclo</span>
                        </div>`;
            html += `<p class="text-gray-300 font-inter leading-tight mb-2">${spell.desc}</p>`;
            
            if (!isUnlocked) {
                html += `<div class="text-[10px] text-gray-400 mt-2">Custo Base: ${cost} CP</div>`;
                if (!hasReqs) {
                    tooltip.className = 'tooltip show';
                    html += `<div class="mt-2 text-red-500 font-bold bg-red-900/30 p-1 border border-red-500/50 rounded"><i class="fa-solid fa-triangle-exclamation"></i> PRÉ-REQUISITOS FALTANTES:</div>`;
                    html += `<ul class="list-disc pl-5 mt-1 text-red-400 text-xs">`;
                    spell.reqs.forEach(req => {
                        if (!userSpells[req]) html += `<li>${spellTree[req] ? spellTree[req].name : req}</li>`;
                    });
                    html += `</ul>`;
                } else {
                    tooltip.className = 'tooltip show good';
                    html += `<div class="mt-2 text-[var(--rpg-purple)] font-bold"><i class="fa-solid fa-unlock"></i> Clique para destravar!</div>`;
                }
            } else {
                tooltip.className = 'tooltip show good';
                html += `<div class="mt-2 text-[var(--rpg-purple)] font-bold"><i class="fa-solid fa-check"></i> Conhecimento Adquirido</div>`;
            }

            tooltip.innerHTML = html;
            
            const rect = e.target.getBoundingClientRect();
            let tx = rect.left + 80; let ty = rect.top - 20;
            if(tx + 250 > window.innerWidth) tx = rect.left - 260; 
            
            tooltip.style.left = tx + 'px'; tooltip.style.top = ty + 'px';
        }

        function hideTooltip() { tooltip.classList.remove('show'); }

        // --- Câmera Espacial Interativa ---
        let scale = 1, panning = false, pointX = 0, pointY = 0, start = { x: 0, y: 0 };
        const map = document.getElementById('tree-canvas');
        const viewport = document.getElementById('tree-viewport');

        function setTransform() { map.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`; }

        viewport.onmousedown = function (e) {
            if(e.button !== 0 || e.target.closest('.hex-node')) return;
            e.preventDefault();
            start = { x: e.clientX - pointX, y: e.clientY - pointY }; panning = true;
        };
        viewport.onmouseup = function (e) { panning = false; };
        viewport.onmouseleave = function (e) { panning = false; hideTooltip(); };
        viewport.onmousemove = function (e) {
            if (!panning) return;
            pointX = (e.clientX - start.x); pointY = (e.clientY - start.y);
            setTransform();
        };

        viewport.onwheel = function (e) {
            e.preventDefault();
            var xs = (e.clientX - pointX) / scale, ys = (e.clientY - pointY) / scale;
            var delta = (e.wheelDelta ? e.wheelDelta : -e.deltaY);
            
            (delta > 0) ? (scale *= 1.1) : (scale /= 1.1);
            scale = Math.min(Math.max(scale, 0.2), 2.5);

            pointX = e.clientX - xs * scale; pointY = e.clientY - ys * scale;
            setTransform();
        };

        function resetView() { scale = 1; pointX = 0; pointY = 0; setTransform(); }

        // Focar Câmera numa direção da árvore
        function focusAngle(angle) {
            resetView();
            // Desloca o canvas na direção OPOSTA ao angulo focado para que a raiz daquela fatia de pizza fique no centro.
            // Para fazer com que o Círculo 1 daquele colégio venha para o centro da tela:
            let radiusDir = 250; // Move câmera 250px nessa direção
            pointX = - (Math.cos(angle * Math.PI / 180) * radiusDir);
            pointY = - (Math.sin(angle * Math.PI / 180) * radiusDir);
            scale = 1.2; // Aproxima o zoom
            setTransform();
        }

    </script>
</body>
</html>
