<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=public/main.html">
    <title>Portal Kuar-Tor - Redirecionando</title>
    <style>
        body {
            background-color: #0B0C10;
            color: #66FCF1;
            font-family: 'Cinzel', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid #1F2833;
            border-top: 4px solid #66FCF1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div>
        <div class="loader"></div>
        <p>Entrando no Nexo de Kuar-Tor...</p>
        <p><small>Se não for redirecionado, <a href="public/main.html" style="color: #66FCF1;">clique aqui</a>.</small></p>
    </div>
</body>
</html>
