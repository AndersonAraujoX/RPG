<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exército Infinito - Kuar-Tor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { rpg: { black: '#0B0C10', cyan: '#66FCF1', slate: '#1F2833', silver: '#C5C6C7' } } } }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../src/styles/theme.css">
    <style>
        body { 
            background-color: #0B0C10;
            overflow: hidden; /* Evita rolagem com muitos monstros */
        }
        
        .puzzle-container {
            background-color: rgba(11, 12, 16, 0.9);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(220, 38, 38, 0.2);
            box-shadow: 0 0 50px rgba(220, 38, 38, 0.1);
            position: relative;
            height: 500px;
            overflow: hidden;
        }

        /* O Portão de Saída (No alto) */
        .high-exit {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 100px;
            background: #1f2937;
            border: 2px solid #4b5563;
            border-bottom: none;
            border-radius: 40px 40px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: not-allowed;
            z-index: 10;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            transition: all 0.3s;
        }

        .high-exit.reachable {
            border-color: #22c55e;
            box-shadow: 0 0 20px #22c55e, inset 0 0 20px #22c55e;
            cursor: pointer;
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 10px #22c55e; }
            50% { box-shadow: 0 0 30px #4ade80; }
            100% { box-shadow: 0 0 10px #22c55e; }
        }

        /* Os Monstros */
        .monster {
            position: absolute;
            font-size: 2.5rem;
            cursor: crosshair;
            user-select: none;
            transition: transform 0.1s;
            animation: spawn 0.3s ease-out;
            z-index: 5;
            filter: drop-shadow(0 0 5px red);
        }

        .monster:active {
            transform: scale(0.8);
        }

        @keyframes spawn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* O cemitério (pilha de corpos) */
        .body-pile {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0px; /* Cresce via JS */
            background: linear-gradient(to top, #450a0a, #7f1d1d);
            border-top: 2px dashed #b91c1c;
            transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.5);
        }

        .body-pile::before {
            content: '💀';
            position: absolute;
            font-size: 2rem;
            opacity: 0.3;
            letter-spacing: 20px;
            white-space: nowrap;
            top: 5px;
        }

        .blood-splatter {
            position: absolute;
            font-size: 2rem;
            pointer-events: none;
            animation: fadeOut 1s forwards;
            z-index: 1;
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(1.5) translateY(20px); }
        }

    </style>
</head>
<body class="text-rpg-silver min-h-screen p-4 flex flex-col items-center">

    <header class="w-full max-w-4xl flex justify-between items-center mb-6 mt-2">
        <h1 class="font-cinzel text-3xl text-red-600 text-glow-cyan drop-shadow-[0_0_10px_rgba(220,38,38,0.8)]">Exército Infinito</h1>
        <a href="index.html" class="btn-rpg bg-gray-800 border-gray-600 text-white">Retornar</a>
    </header>

    <div class="max-w-4xl w-full grid grid-cols-1 md:grid-cols-4 gap-4 h-[600px]">
        
        <!-- Painel Lateral -->
        <div class="col-span-1 puzzle-container rounded-xl p-6 flex flex-col justify-between" style="height: 100%;">
            <div>
                <h2 class="font-cinzel text-xl text-red-500 mb-4 border-b border-red-900 pb-2">A Horda</h2>
                <p class="text-gray-300 text-sm mb-4">
                    Vocês entraram em um poço profundo. Dezenas de demônios sombrios começam a surgir das paredes.
                </p>
                <p class="text-gray-300 text-sm mb-4">
                    Eles são surpreendentemente fracos... morrem com um único golpe. Mas não param de vir!
                </p>
                
                <div class="bg-gray-900 border border-gray-700 p-3 rounded text-xs text-gray-400 mt-6 text-center">
                    <div class="text-red-500 font-bold text-lg mb-1" id="kill-count">0</div>
                    <div>Demônios Abatidos</div>
                </div>
            </div>

            <button onclick="startGame()" class="btn-rpg bg-red-900 border-red-600 text-white w-full animate-pulse" id="start-btn">Iniciar Combate</button>
        </div>

        <!-- A Arena de Combate -->
        <div class="col-span-3 puzzle-container rounded-xl p-0 relative" id="arena">
            
            <div class="high-exit" id="high-exit" onclick="tryExit()" title="A saída está muito alta...">🚪</div>

            <div class="body-pile" id="body-pile"></div>

            <div id="spawner-area" class="absolute inset-0 pointer-events-none overflow-hidden">
                <!-- Monstros gerados aqui -->
            </div>
            
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-20 hidden" id="overlay-msg">
                <h2 class="font-cinzel text-4xl text-green-500 drop-shadow-[0_0_20px_black] bg-black/50 px-8 py-4 rounded">Fuga Bem-Sucedida!</h2>
            </div>
        </div>

    </div>

    <script>
        const REQUIRED_BODIES = 30; // Quantos monstros precisa matar para subir
        const MAX_HEIGHT_PX = 350; // Altura máxima que a pilha chega (perto da porta)

        let killCount = 0;
        let isPlaying = false;
        let spawnInterval;
        let moveInterval;

        const arena = document.getElementById('arena');
        const spawnerArea = document.getElementById('spawner-area');
        const bodyPile = document.getElementById('body-pile');
        const killCountDisplay = document.getElementById('kill-count');
        const highExit = document.getElementById('high-exit');
        const startBtn = document.getElementById('start-btn');
        const overlayMsg = document.getElementById('overlay-msg');

        const monsterIcons = ['🐺', '🦇', '🕷️', '🧟', '👹'];

        function startGame() {
            if (isPlaying) return;
            isPlaying = true;
            killCount = 0;
            updateStats();
            spawnerArea.innerHTML = '';
            startBtn.classList.remove('animate-pulse');
            startBtn.textContent = "Em Combate...";
            startBtn.disabled = true;
            startBtn.classList.replace('bg-red-900', 'bg-gray-800');
            startBtn.classList.replace('border-red-600', 'border-gray-600');
            
            overlayMsg.classList.add('hidden');
            highExit.classList.remove('reachable');
            highExit.title = "A saída está muito alta para alcançar.";

            // Começa a spawnar a cada 600ms
            spawnInterval = setInterval(spawnMonster, 600);
            
            // Move os monstros
            moveInterval = setInterval(moveMonsters, 50);
        }

        function spawnMonster() {
            if (!isPlaying) return;

            const icon = monsterIcons[Math.floor(Math.random() * monsterIcons.length)];
            const monster = document.createElement('div');
            monster.className = 'monster';
            monster.textContent = icon;
            
            // Posição aleatória na tela (evita o topo onde está a porta)
            const x = Math.random() * (arena.offsetWidth - 50);
            const y = (Math.random() * (arena.offsetHeight - 200)) + 100;

            monster.style.left = `${x}px`;
            monster.style.top = `${y}px`;
            
            // Vetor de movimento
            monster.dataset.vx = (Math.random() - 0.5) * 10;
            monster.dataset.vy = (Math.random() - 0.5) * 10;

            monster.style.pointerEvents = 'auto'; // Habilita o clique

            monster.onmousedown = (e) => killMonster(monster, e.clientX, e.clientY);

            spawnerArea.appendChild(monster);
        }

        function moveMonsters() {
            const monsters = document.querySelectorAll('.monster');
            monsters.forEach(m => {
                let x = parseFloat(m.style.left);
                let y = parseFloat(m.style.top);
                let vx = parseFloat(m.dataset.vx);
                let vy = parseFloat(m.dataset.vy);

                x += vx;
                y += vy;

                // Colisão com as paredes
                if (x <= 0 || x >= arena.offsetWidth - 40) { m.dataset.vx = -vx; }
                
                // Colisão com o chão/pilha de corpos e o teto
                const currentFloor = arena.offsetHeight - parseFloat(bodyPile.style.height || 0);
                if (y <= 50) { m.dataset.vy = Math.abs(vy); } // Bate no teto
                if (y >= currentFloor - 40) { m.dataset.vy = -Math.abs(vy); } // Bate no chão/pilha

                m.style.left = `${x}px`;
                m.style.top = `${y}px`;
            });
        }

        function killMonster(element, clickX, clickY) {
            if (!isPlaying) return;

            // Remove o monstro
            element.remove();

            // Efeito de sangue
            const splatter = document.createElement('div');
            splatter.className = 'blood-splatter';
            splatter.textContent = '🩸';
            
            // Compensa a posição do arena (relativo à tela vs relativo ao contêiner)
            const rect = arena.getBoundingClientRect();
            splatter.style.left = `${clickX - rect.left - 15}px`;
            splatter.style.top = `${clickY - rect.top - 15}px`;
            
            spawnerArea.appendChild(splatter);
            setTimeout(() => splatter.remove(), 1000);

            // Aumenta contador
            killCount++;
            updateStats();

            // Acelera o spawn a cada 10 kills para simular horda infinita
            if (killCount % 10 === 0 && killCount < 50) {
                clearInterval(spawnInterval);
                spawnInterval = setInterval(spawnMonster, Math.max(200, 600 - (killCount * 5)));
            }
        }

        function updateStats() {
            killCountDisplay.textContent = killCount;

            // Calcula a altura da pilha de corpos (até MAX_HEIGHT_PX)
            const progress = Math.min(killCount / REQUIRED_BODIES, 1);
            const newHeight = progress * MAX_HEIGHT_PX;
            
            bodyPile.style.height = `${newHeight}px`;

            if (killCount >= REQUIRED_BODIES && !highExit.classList.contains('reachable')) {
                highExit.classList.add('reachable');
                highExit.title = "A pilha de corpos está alta o suficiente! Suba para escapar!";
            }
        }

        function tryExit() {
            if (killCount >= REQUIRED_BODIES && isPlaying) {
                // Vitória!
                isPlaying = false;
                clearInterval(spawnInterval);
                clearInterval(moveInterval);
                
                overlayMsg.classList.remove('hidden');
                
                setTimeout(() => {
                    alert("A aventura continua! O grupo escala a montanha de bestas sombrias e escapa do poço antes de ser subjugado pela horda.");
                    window.location.href = 'index.html';
                }, 3000);
            } else if (isPlaying) {
                alert("A saída está longe do seu alcance. Você precisaria de uma grande elevação para pular até lá...");
            }
        }

    </script>
</body>
</html>
