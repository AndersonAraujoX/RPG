<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário de Expedição &middot; Kuar-Tor (+2d6)</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>">
    <link rel="stylesheet" href="tailwind.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            background-color: #04070d;
            color: #cbd5e1;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 12%, rgba(217, 119, 6, 0.08) 0%, transparent 50%),
                linear-gradient(to bottom, rgba(4, 7, 13, 0.88), rgba(4, 7, 13, 0.98)),
                url('https://images.unsplash.com/photo-1524654458049-e36be0721fa2?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
        }

        .font-cinzel { font-family: 'Cinzel', serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .journal-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.92) 0%, rgba(9, 14, 26, 0.96) 100%);
            border-left: 4px solid #f59e0b;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
            transition: all 0.25s ease;
        }

        .journal-card:hover {
            transform: translateX(6px);
            border-left-color: #06b6d4;
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>

<body class="p-4 md:p-8 flex flex-col min-h-screen">
    <div class="w-full max-w-5xl mx-auto flex-1 flex flex-col">

        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8 pb-6 border-b border-slate-800">
            <div>
                <div class="flex items-center gap-3">
                    <span class="text-amber-500 text-2xl select-none">ᛋ</span>
                    <h1 class="font-cinzel text-2xl md:text-3xl font-bold text-amber-400 tracking-wide">
                        DIÁRIO DE EXPEDIÇÃO
                    </h1>
                </div>
                <p class="text-xs text-gray-400 mt-1">Crônicas, descobertas e memórias da campanha "A Última Expedição"</p>
            </div>
            <div class="flex gap-2.5 flex-wrap items-center">
                <a href="../index.html" class="px-4 py-2 bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 text-gray-200 rounded-lg text-xs font-cinzel font-bold transition flex items-center gap-2 no-underline">
                    <i class="fa-solid fa-arrow-left"></i> Menu Principal
                </a>
                <button type="button" id="exportDiaryBtn" class="px-3.5 py-2 bg-amber-900/60 hover:bg-amber-800/80 border border-amber-600/60 text-amber-300 rounded-lg text-xs font-cinzel font-bold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-download"></i> Exportar
                </button>
                <button type="button" id="importDiaryBtn" class="px-3.5 py-2 bg-neutral-800 hover:bg-neutral-700 border border-neutral-600 text-gray-200 rounded-lg text-xs font-cinzel font-bold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-upload"></i> Importar
                </button>
                <input type="file" id="diaryFileInput" accept=".json" class="hidden">
            </div>
        </header>

        <!-- Form de Novo Relato -->
        <section class="bg-neutral-900/90 border border-slate-800 rounded-2xl p-5 md:p-6 mb-8 shadow-xl">
            <h2 class="font-cinzel text-base font-bold text-amber-300 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-feather-pointed text-amber-400"></i> Registrar Nova Entrada
            </h2>
            <form id="diaryEntryForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Título do Relato</label>
                        <input type="text" id="entryTitle" required placeholder="Ex: O Templo dos Três Ecos" class="w-full bg-neutral-950 border border-neutral-700 rounded-lg px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Autor / Operativo</label>
                        <input type="text" id="entryAuthor" placeholder="Ex: Arthur Pendelton" class="w-full bg-neutral-950 border border-neutral-700 rounded-lg px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Tag / Tipo de Registro</label>
                        <select id="entryTag" class="w-full bg-neutral-950 border border-neutral-700 rounded-lg px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-amber-500">
                            <option value="Combate">⚔️ Combate & Batalha</option>
                            <option value="Exploração">🗺️ Exploração & Viagem</option>
                            <option value="Mistério">🔮 Mistério & Lore</option>
                            <option value="Tesouro">💎 Espólios & Recompensas</option>
                            <option value="Descanso">🏕️ Descanso & Acampamento</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Conteúdo da Crônica</label>
                    <textarea id="entryContent" required rows="4" placeholder="Descreva os acontecimentos cruciais da expedição..." class="w-full bg-neutral-950 border border-neutral-700 rounded-lg p-3 text-xs text-gray-200 focus:outline-none focus:border-amber-500"></textarea>
                </div>
                <div class="flex justify-end">
                    <button type="submit" class="px-6 py-2.5 bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-neutral-950 font-cinzel font-bold text-xs rounded-xl shadow-lg transition flex items-center gap-2">
                        <i class="fa-solid fa-bookmark"></i> Gravar nas Crônicas
                    </button>
                </div>
            </form>
        </section>

        <!-- Lista de Entradas -->
        <section class="flex-1">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-cinzel text-base font-bold text-gray-200 flex items-center gap-2">
                    <i class="fa-solid fa-scroll text-cyan-400"></i> Memórias Registradas (<span id="entryCount">0</span>)
                </h3>
                <div class="flex gap-2">
                    <input type="text" id="searchDiaryInput" placeholder="Filtrar registros..." class="bg-neutral-950 border border-neutral-700 rounded-lg px-3 py-1 text-xs text-gray-200 w-48 focus:outline-none focus:border-cyan-500">
                </div>
            </div>

            <div id="diaryListContainer" class="space-y-4">
                <!-- Entradas renderizadas dinamicamente -->
            </div>
        </section>
    </div>

    <script type="module">
        const DIARY_STORAGE_KEY = 'kuartor_expedition_diary';

        const defaultEntries = [
            {
                id: 'entry_init_1',
                title: 'O Primeiro Passo nas Praias de Cinzas',
                author: 'Mestre da Expedição',
                tag: 'Exploração',
                date: new Date().toLocaleDateString('pt-BR'),
                content: 'Desembarcamos ao amanhecer sob a névoa púrpura de Kuar-Tor. As ruínas do farol antigo ainda emitem um zumbido estranho. A bússola gira sem rumo.'
            }
        ];

        function getSavedEntries() {
            try {
                const raw = localStorage.getItem(DIARY_STORAGE_KEY);
                return raw ? JSON.parse(raw) : defaultEntries;
            } catch (e) {
                return defaultEntries;
            }
        }

        function saveEntries(entries) {
            try {
                localStorage.setItem(DIARY_STORAGE_KEY, JSON.stringify(entries));
            } catch (e) {}
        }

        let currentEntries = getSavedEntries();

        function renderDiaryList(filterText = '') {
            const container = document.getElementById('diaryListContainer');
            const countEl = document.getElementById('entryCount');
            if (!container) return;

            const term = filterText.toLowerCase().trim();
            const filtered = currentEntries.filter(e => 
                !term || e.title.toLowerCase().includes(term) || e.content.toLowerCase().includes(term) || e.author.toLowerCase().includes(term)
            );

            if (countEl) countEl.textContent = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-500 italic text-center py-8">Nenhum registro encontrado nas crônicas.</p>';
                return;
            }

            container.innerHTML = filtered.map(e => `
                <article class="journal-card rounded-xl p-4 md:p-5 relative group">
                    <div class="flex justify-between items-start gap-3 mb-2">
                        <div>
                            <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-neutral-800 text-amber-300 border border-amber-600/30 uppercase mr-2">${e.tag}</span>
                            <span class="text-xs text-gray-400 font-mono">${e.date || ''}</span>
                            <h4 class="font-cinzel text-base md:text-lg font-bold text-gray-100 mt-1">${e.title}</h4>
                        </div>
                        <button type="button" class="delete-entry-btn text-gray-500 hover:text-red-400 text-xs p-1 transition" data-id="${e.id}" title="Excluir entrada">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                    <p class="text-xs text-gray-300 leading-relaxed whitespace-pre-wrap">${e.content}</p>
                    <div class="mt-3 pt-2 border-t border-slate-800/60 text-[11px] text-gray-400 italic">
                        Registrado por: <strong class="text-gray-300 not-italic">${e.author || 'Anônimo'}</strong>
                    </div>
                </article>
            `).join('');

            container.querySelectorAll('.delete-entry-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    if (confirm('Deseja excluir esta memória das crônicas?')) {
                        currentEntries = currentEntries.filter(e => e.id !== id);
                        saveEntries(currentEntries);
                        renderDiaryList(document.getElementById('searchDiaryInput')?.value || '');
                    }
                });
            });
        }

        // Form Submit
        document.getElementById('diaryEntryForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const titleInput = document.getElementById('entryTitle');
            const authorInput = document.getElementById('entryAuthor');
            const tagInput = document.getElementById('entryTag');
            const contentInput = document.getElementById('entryContent');

            const newEntry = {
                id: `entry_${Date.now()}`,
                title: titleInput.value.trim(),
                author: authorInput.value.trim() || 'Operativo',
                tag: tagInput.value,
                date: new Date().toLocaleDateString('pt-BR'),
                content: contentInput.value.trim()
            };

            currentEntries.unshift(newEntry);
            saveEntries(currentEntries);
            renderDiaryList();

            titleInput.value = '';
            contentInput.value = '';
        });

        // Search
        document.getElementById('searchDiaryInput')?.addEventListener('input', (e) => {
            renderDiaryList(e.target.value);
        });

        // Export JSON
        document.getElementById('exportDiaryBtn')?.addEventListener('click', () => {
            const blob = new Blob([JSON.stringify(currentEntries, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `diario_expedicao_kuartor_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // Import JSON
        const fileInput = document.getElementById('diaryFileInput');
        document.getElementById('importDiaryBtn')?.addEventListener('click', () => fileInput?.click());
        fileInput?.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (Array.isArray(imported)) {
                        currentEntries = imported;
                        saveEntries(currentEntries);
                        renderDiaryList();
                        alert('Diário importado com sucesso!');
                    }
                } catch (err) {
                    alert('Arquivo inválido.');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        renderDiaryList();
    </script>
</body>
</html>
